name: Update Profile Activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate activity graph
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: stats
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Copy activity graph
        env:
          READY_DIR: ${{ steps.stats.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$READY_DIR"/activity-consistency-wide-dark.svg \
            profile/github-activity.svg

          test -s profile/github-activity.svg

          git add profile/github-activity.svg

      - name: Commit activity graph
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub activity graph"
          git push
